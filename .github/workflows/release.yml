# 태그(예: 1.0.1)를 push하면 빌드해서 BRAT이 받아 갈 릴리스(main.js, manifest.json)를 만든다
name: release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node build.mjs
      - run: gh release create "$GITHUB_REF_NAME" dist/main.js manifest.json --title "$GITHUB_REF_NAME" --notes "링크 스크랩 $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
